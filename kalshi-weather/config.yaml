# Risk management
risk:
  bankroll: 500.00
  risk_tolerance: 0.25
  max_single_position_pct: 0.10
  max_daily_exposure_pct: 0.25
  max_portfolio_exposure_pct: 0.30
  min_edge: 0.02
  min_confidence: 0.55
  adjacent_brackets: true

# Schedule
schedule:
  collect_time: "07:30"
  predict_time: "07:35"
  execute_time: "07:45"
  settle_time: "08:00"

# Notifications (optional)
notifications:
  enabled: false
  discord_webhook: "${DISCORD_WEBHOOK_URL}"

# Logging
logging:
  level: "INFO"
  file: "pavlov.log"
